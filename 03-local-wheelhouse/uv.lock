version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "local-wheelhouse"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "python-dateutil" },
]

[package.metadata]
requires-dist = [{ name = "python-dateutil", specifier = ">=2.9.0.post0" }]

[[package]]
name = "python-dateutil"
version = "2.9.0.post0"
source = { registry = "wheels" }
dependencies = [
    { name = "six" },
]
wheels = [
    { path = "python_dateutil-2.9.0.post0-py2.py3-none-any.whl" },
]

[[package]]
name = "six"
version = "1.17.0"
source = { registry = "wheels" }
wheels = [
    { path = "six-1.17.0-py2.py3-none-any.whl" },
]
