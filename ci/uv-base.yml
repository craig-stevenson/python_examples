# Shared base for every example's child pipeline.
# The uv version is pinned here and nowhere else.

variables:
  # Override at project level to pull from an internal registry mirror.
  UV_IMAGE: ghcr.io/astral-sh/uv:0.8.13-python3.12-bookworm-slim

.uv:
  image: $UV_IMAGE
  variables:
    # Keep the cache inside the project dir so GitLab can save it.
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    # The cache and the venv are on different filesystems in CI; copy instead of hardlink.
    UV_LINK_MODE: copy
  cache:
    key: uv-$EXAMPLE_DIR
    paths:
      - .uv-cache
  before_script:
    # Jobs start at the repo root. EXAMPLE_DIR comes from the parent trigger job.
    - cd "$EXAMPLE_DIR"
  after_script:
    # Drop what is cheap to re-download so the saved cache stays small.
    - uv cache prune --ci
